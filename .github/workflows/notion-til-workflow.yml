name: Notion TIL Workflow

on:
  schedule:
    # 매일 오전 9시 20분, 오후 9시 20분 (KST)
    # 다른 워크플로도 README.md 를 고치므로 같은 시각에 겹치지 않게 벌려 둡니다
    - cron: '20 0,12 * * *'
  workflow_dispatch: # 수동 실행
  push:
    paths: # 설정을 고치면 바로 다시 그리도록
      - '.github/workflows/notion-til-workflow.yml'
      - '.github/scripts/sync_notion_til.py'
  repository_dispatch:
    types: [til-updated] # 노션에서 웹훅으로 즉시 트리거할 때

jobs:
  update-readme-with-til:
    name: Update README with Notion TIL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update README with latest TIL
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: 3ac35bb3-67d1-8086-83c4-caa7afbb757f
          MARKER_TAG: NOTION-TIL
          README_PATH: README.md
          TIL_PATH: TIL.md
          RECENT_COUNT: '3'                     # README 에 보일 글 개수
          MAX_TITLE: '30'                       # 제목이 이보다 길면 … 로 줄임
          MAX_TAGS: '3'                         # 키워드는 3개까지, 나머지는 +N
          TITLE_STRIP: 'Today I Learned -'      # 제목마다 반복되는 접두어 떼기
          TIL_HEADERS: '다중 선택=키워드'         # 표 머리글 바꿔 달기 (노션속성=보여줄이름)
          TIL_FILTER: '상태=완료'                # 완료된 글만 표시 (주말 자동생성 빈 페이지 제외)
          # TIL_COLUMNS: "이름,날짜,다중 선택,상태"   # 자동 감지가 마음에 안 들면 직접 지정
        run: python .github/scripts/sync_notion_til.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: 노션 TIL 업데이트'
          file_pattern: README.md TIL.md
